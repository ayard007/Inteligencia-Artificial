<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proyecto II — Laberinto Inteligente | UNE</title>
<style>
:root{
  --azul:#20276b; --azul2:#2b3a8c; --rojo:#e2231a;
  --gris:#f4f5f9; --gris2:#e6e8f0; --texto:#1c2230;
  --suave:#5a6275; --sombra:0 4px 18px rgba(32,39,107,0.10); --code:#1e2438;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--gris);color:var(--texto);line-height:1.7;font-size:17px}
.layout{display:flex;max-width:1340px;margin:0 auto}
nav.sidebar{width:290px;background:var(--azul);color:#fff;min-height:100vh;padding:24px 16px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
nav.sidebar .logo-box{background:#fff;border-radius:14px;padding:14px;text-align:center;margin-bottom:18px}
nav.sidebar .logo-box img{width:110px;height:auto}
nav.sidebar h2{font-size:12.5px;text-transform:uppercase;letter-spacing:1px;color:#aeb6e0;margin:18px 0 8px;border-bottom:1px solid #3a4494;padding-bottom:6px}
nav.sidebar a{display:block;color:#dce0f4;text-decoration:none;padding:7px 12px;border-radius:8px;font-size:14px;margin-bottom:2px;transition:background .2s}
nav.sidebar a:hover{background:var(--azul2);color:#fff}
nav.sidebar a.principal{font-weight:600;color:#fff}
main{flex:1;background:var(--gris);min-width:0}
header.hero{background:linear-gradient(135deg,var(--azul) 0%,var(--azul2) 60%,#3a47a0 100%);color:#fff;padding:44px 46px 38px}
header.hero .kicker{display:inline-block;background:var(--rojo);color:#fff;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:5px 14px;border-radius:20px;margin-bottom:16px}
header.hero h1{font-size:32px;line-height:1.25;margin-bottom:12px;font-weight:700}
header.hero p{font-size:18px;color:#d5daf2;max-width:820px}
header.hero .meta{margin-top:20px;display:flex;flex-wrap:wrap;gap:12px}
header.hero .meta span{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);padding:7px 15px;border-radius:8px;font-size:14px}
.contenido{padding:36px 46px 70px}
section.card{background:#fff;border-radius:16px;padding:28px 32px;margin-bottom:24px;box-shadow:var(--sombra);scroll-margin-top:16px}
section.card h2{color:var(--azul);font-size:24px;margin-bottom:6px;display:flex;align-items:center;gap:12px}
section.card h2 .num{background:var(--azul);color:#fff;width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;font-weight:700}
section.card h3{color:var(--azul2);font-size:19px;margin:20px 0 8px}
section.card h4{color:var(--rojo);font-size:14px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.5px}
section.card p{margin-bottom:13px}
